# EKSEMPEL – tilpass domenet, sertifikatstier og dist-katalogen.
# Legg denne inn i eksisterende HTTPS-serverkonfigurasjon. Ikke bruk admin over HTTP.
server {
    listen 443 ssl;
    server_name eksempel.no;

    ssl_certificate     /etc/letsencrypt/live/eksempel.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eksempel.no/privkey.pem;

    root /var/www/portfolio;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}